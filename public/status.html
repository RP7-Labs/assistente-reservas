<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status dos serviços</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 36px 16px 48px }
  .cab { display: flex; align-items: center; gap: 12px; margin-bottom: 18px }
  h1 { font-size: 26px; font-weight: 800 }
  #resumo { margin: 0 0 28px; font-size: 16px; font-weight: 700; padding: 14px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border) }
  h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 26px 0 10px; text-transform: uppercase }
  .grupo { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden }
  .item { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-bottom: 1px solid var(--border) }
  .item:last-child { border-bottom: 0 }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--faint); box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 0%, transparent) }
  .nome { font-weight: 700 }
  .rota { font: 12.5px ui-monospace, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .info { margin-left: auto; color: var(--muted); font-size: 13.5px; text-align: right }
  .ok .dot { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-50) } .pendente .dot { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-50) } .erro .dot { background: var(--err); box-shadow: 0 0 0 4px var(--err-50) }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 30px }
  @media (max-width: 560px) { .rota { display: none } .item { padding: 13px 14px; flex-wrap: wrap } .info { margin-left: 24px; text-align: left; width: 100% } }
</style>
</head>
<body>
<main>
  <div class="cab"><span class="marca"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg></span></span><h1>Status dos serviços</h1></div>
  <p id="resumo">Verificando…</p>
  <h2>Backend</h2>
  <div class="grupo" id="backend"></div>
  <h2>Canais e integrações</h2>
  <div class="grupo" id="canais"></div>
  <footer id="rodape"></footer>
</main>
<script>
const INTERVALO = 15000;
const BACKEND = [
  { id: "api", nome: "API", rota: "/api/health" },
  { id: "banco", nome: "Banco de dados", rota: "Postgres" },
  { id: "metricas", nome: "Métricas", rota: "/api/metricas" },
];
const CANAIS = [
  { id: "web", nome: "Chat web", rota: "/" },
  { id: "ia", nome: "Assistente", rota: "IA ou regras" },
  { id: "rastreio", nome: "Links rastreáveis", rota: "/r/:id" },
  { id: "whatsapp", nome: "WhatsApp", rota: "/webhook/whatsapp" },
  { id: "pagamento", nome: "Pagamento", rota: "/pagamento" },
  { id: "email", nome: "E-mail", rota: "Resend" },
  { id: "fechaduras", nome: "Fechaduras", rota: "TTLock" },
  { id: "fnrh", nome: "Ficha de hóspedes", rota: "FNRH Digital" },
];

function montar(alvo, lista) {
  document.getElementById(alvo).innerHTML = lista.map(s =>
    `<div class="item" id="s-${s.id}"><span class="dot"></span><span class="nome">${s.nome}</span>` +
    `<span class="rota">${s.rota}</span><span class="info">…</span></div>`).join("");
}
function marcar(id, estado, info) {
  const el = document.getElementById("s-" + id);
  el.className = "item " + estado;
  el.querySelector(".info").textContent = info;
}
async function medir(url) {
  const t = performance.now();
  try {
    const r = await fetch(url, { cache: "no-store" });
    return { ok: r.ok, status: r.status, ms: Math.round(performance.now() - t), corpo: r.headers.get("content-type")?.includes("json") ? await r.json() : null };
  } catch { return { ok: false, status: 0, ms: Math.round(performance.now() - t), corpo: null }; }
}
const http = (r) => r.status ? `HTTP ${r.status} · ${r.ms}ms` : "sem resposta";

async function atualizar() {
  const [health, metricas, web] = await Promise.all([medir("/api/health"), medir("/api/metricas"), medir("/")]);
  marcar("api", health.status ? "ok" : "erro", http(health));
  marcar("metricas", metricas.ok ? "ok" : "erro", http(metricas));
  marcar("web", web.ok ? "ok" : "erro", http(web));

  const servicos = Object.fromEntries((health.corpo?.servicos || []).map(s => [s.nome, s]));
  for (const id of ["banco", "ia", "rastreio", "whatsapp", "pagamento", "email", "fechaduras", "fnrh"]) {
    const s = servicos[id];
    if (!s) { marcar(id, "erro", "sem dados"); continue; }
    marcar(id, s.estado, s.estado === "ok" ? (s.ms != null ? `${s.detalhe} · ${s.ms}ms` : s.detalhe) : s.detalhe);
  }

  const itens = [...document.querySelectorAll(".item")];
  const ok = itens.filter(e => e.classList.contains("ok")).length;
  const erros = itens.filter(e => e.classList.contains("erro")).length;
  const resumo = document.getElementById("resumo");
  resumo.textContent = `${ok}/${itens.length} serviços no ar` + (erros ? ` · ${erros} com erro` : "") +
    (itens.length - ok - erros ? ` · ${itens.length - ok - erros} pendente(s) de configuração` : "");
  resumo.style.color = erros ? "var(--err)" : ok === itens.length ? "var(--ok)" : "var(--warn)";
  document.getElementById("rodape").textContent =
    `Atualizado ${new Date().toLocaleTimeString("pt-BR")} · auto-refresh ${INTERVALO / 1000}s`;
}

montar("backend", BACKEND);
montar("canais", CANAIS);
atualizar();
setInterval(atualizar, INTERVALO);
</script>
</body>
</html>
